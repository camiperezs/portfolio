<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChamDev, portfolio de Camila Perez, Desarrolladora Backend.">
    <link rel="icon" type="image/png" href="/sprites/hoja-sello.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+20&family=Jersey+25&family=Onest:wght@400;500;600;700&display=swap">
    <title>ChamDev</title>
    <script>
        (function () {
            var preferencia = null;
            try {
                preferencia = localStorage.getItem('tema');
            } catch (error) {}
            var oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var tema = preferencia === 'dia' || preferencia === 'noche' ? preferencia : oscuro ? 'noche' : 'dia';
            document.documentElement.dataset.tema = tema;
        })();
    </script>
</head>
<body>
    <form name="contacto" data-netlify="true" netlify-honeypot="campo-trampa" hidden>
        <input type="text" name="nombre">
        <input type="email" name="email">
        <input type="tel" name="telefono">
        <input type="text" name="motivo">
        <textarea name="mensaje"></textarea>
        <input type="text" name="campo-trampa">
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
