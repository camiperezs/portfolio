<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ChamDev, portfolio de Camila Perez, Desarrolladora Full Stack. Desarrollo soluciones web a medida: sitios, integraciones, automatizaciones y sistemas de gestión.">
    <meta name="theme-color" content="#faf6ef" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14101a" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Onest:wght@400;500;600;700&display=swap">
    <title>ChamDev</title>
    <script>
        (function () {
            var preference = null;
            try {
                preference = localStorage.getItem('theme');
            } catch (error) {}
            var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = preference === 'light' || preference === 'dark' ? preference : dark ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
</head>
<body>
    <form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="text" name="name">
        <input type="email" name="email">
        <input type="text" name="reason">
        <input type="text" name="service">
        <textarea name="message"></textarea>
        <input type="text" name="bot-field">
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
